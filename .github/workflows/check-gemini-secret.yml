name: Check Gemini Secret

on:
  push:
    paths:
      - ".github/workflows/check-gemini-secret.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GEMINI_API_KEY is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured for this repository."
