name: Zoo V8 Render

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of cards to process; use 0 for all
        required: true
        default: "16"
      offset:
        description: Starting row offset
        required: true
        default: "0"
      concurrency:
        description: Parallel Gemini jobs
        required: true
        default: "4"
      image_size:
        description: Gemini generation resolution
        required: true
        type: choice
        options:
          - 1K
          - 2K
          - 4K
        default: 2K
      mode:
        description: Art plate for production; full card for visual proofs only
        required: true
        type: choice
        options:
          - art-plate
          - full-card
        default: art-plate
      dry_run:
        description: Validate and write prompt previews without paid generation
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/zoo-v8-dry-run.request"
      - ".github/workflows/zoo-v8-render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      ZOO_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '16' }}
      ZOO_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.offset || '0' }}
      ZOO_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '4' }}
      ZOO_IMAGE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_size || '2K' }}
      ZOO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'art-plate' }}
      ZOO_DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-zoo-v8.txt

      - name: Install Zoo V8 dependencies
        run: pip install -r requirements-zoo-v8.txt

      - name: Validate Gemini secret
        if: ${{ env.ZOO_DRY_RUN != 'true' }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "GEMINI_API_KEY is available."

      - name: Run Zoo V8 renderer
        shell: bash
        run: |
          EXTRA=""
          if [ "$ZOO_DRY_RUN" = "true" ]; then
            EXTRA="--dry-run"
          fi
          python scripts/render_cards.py \
            --csv data/v7.1_zoo_prompts.csv \
            --limit "$ZOO_LIMIT" \
            --offset "$ZOO_OFFSET" \
            --concurrency "$ZOO_CONCURRENCY" \
            --image-size "$ZOO_IMAGE_SIZE" \
            --mode "$ZOO_MODE" \
            $EXTRA

      - name: Upload V8 renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoo-v8-${{ env.ZOO_MODE }}-offset-${{ env.ZOO_OFFSET }}-limit-${{ env.ZOO_LIMIT }}
          path: |
            renders/v8/**
            reports/v8/**
          if-no-files-found: warn
          retention-days: 14
