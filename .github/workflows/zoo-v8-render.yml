name: Zoo V8 Render

on:
  workflow_dispatch:
    inputs:
      card_id:
        description: Optional exact card ID; overrides limit and offset
        required: false
        default: ""
      limit:
        description: Number of cards to process; use 0 for all
        required: true
        default: "16"
      offset:
        description: Starting row offset
        required: true
        default: "0"
      concurrency:
        description: Parallel Gemini jobs
        required: true
        default: "4"
      image_size:
        description: Gemini generation resolution
        required: true
        type: choice
        options:
          - 1K
          - 2K
          - 4K
        default: 2K
      mode:
        description: Art plate for production; full card for visual proofs
        required: true
        type: choice
        options:
          - art-plate
          - full-card
        default: art-plate
      dry_run:
        description: Validate and write prompt previews without paid generation
        required: true
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    paths:
      - scripts/render_cards.py
      - scripts/zoo_v8_rules.py
      - requirements-zoo-v8.txt
      - .github/workflows/zoo-v8-render.yml

permissions:
  contents: read

jobs:
  render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-zoo-v8.txt

      - name: Install Zoo V8 dependencies
        run: pip install -r requirements-zoo-v8.txt

      - name: Validate Gemini secret
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "GEMINI_API_KEY is available."

      - name: Run Zoo V8 renderer
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          if [ -n "${{ inputs.card_id }}" ]; then
            EXTRA="$EXTRA --card-id ${{ inputs.card_id }}"
          fi
          python scripts/render_cards.py \
            --csv data/v7.1_zoo_prompts.csv \
            --limit "${{ inputs.limit }}" \
            --offset "${{ inputs.offset }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --image-size "${{ inputs.image_size }}" \
            --mode "${{ inputs.mode }}" \
            $EXTRA

      - name: Upload V8 images and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoo-v8-${{ inputs.mode }}-${{ inputs.card_id || format('offset-{0}-limit-{1}', inputs.offset, inputs.limit) }}
          path: |
            renders/v8/**
            reports/v8/**
          if-no-files-found: error
          retention-days: 14

  end-to-end-image-pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-zoo-v8.txt

      - name: Install Zoo V8 dependencies
        run: pip install -r requirements-zoo-v8.txt

      - name: Require Gemini secret
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }

      - name: Generate one complete V8 image
        run: |
          python scripts/render_cards.py \
            --csv data/v7.1_zoo_prompts.csv \
            --card-id A001 \
            --concurrency 1 \
            --image-size 1K \
            --mode full-card \
            --retries 1

      - name: Verify image artifact
        shell: bash
        run: |
          IMAGE=$(find renders/v8/full-card -type f -name '*.png' -print -quit)
          test -n "$IMAGE" || { echo "No PNG image produced"; exit 1; }
          test $(stat -c%s "$IMAGE") -gt 10000 || { echo "PNG is too small"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = list(Path('renders/v8/full-card').glob('*.png'))
          assert len(files) == 1, f'Expected one PNG, found {len(files)}'
          with Image.open(files[0]) as image:
              image.verify()
          print(files[0])
          PY

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: zoo-v8-end-to-end-A001-image
          path: |
            renders/v8/full-card/*.png
            reports/v8/**
          if-no-files-found: error
          retention-days: 14
