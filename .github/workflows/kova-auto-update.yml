name: KOVA Auto Update

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  validate-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository
        run: |
          set -e
          test -f README.md || echo '# KOVA OS' > README.md
          mkdir -p docs/status
          printf '# KOVA Automated Status\n\nLast workflow run: %s UTC\n\nCommit: `%s`\n' "$(date -u '+%Y-%m-%d %H:%M:%S')" "$GITHUB_SHA" > docs/status/AUTO_STATUS.md
      - name: Commit generated status when changed
        run: |
          git config user.name 'kova-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/status/AUTO_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(kova): automated status update'
          git push
