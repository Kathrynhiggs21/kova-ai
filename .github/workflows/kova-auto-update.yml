name: KOVA Continuous Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate canonical KOVA files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/KOVA_CANONICAL_ARCHITECTURE.md
          test -f .gitignore

      - name: Check repository cleanliness and basic project health
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if [ -f package.json ]; then
            node --version
            npm --version
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            fi
            npm test --if-present
          fi

      - name: Write KOVA audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '# KOVA Continuous Audit'
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Run time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo 'The workflow is intentionally read-only. Canonical updates should enter through reviewed commits/PRs rather than a bot pushing directly to protected `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
