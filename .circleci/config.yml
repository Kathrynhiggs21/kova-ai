version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Test
          command: npm test -- --runInBand
      - run:
          name: Build
          command: npm run build

workflows:
  test-and-build:
    jobs:
      - test
