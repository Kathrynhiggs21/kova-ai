# Mergify configuration for a mixed legacy migration-source repository.
# Keep merge automation conservative until branch protections and deterministic
# required checks are explicitly verified for this repository's current role.

pull_request_rules:
  - name: disable automerge labels in mixed legacy repo
    conditions:
      - label=automerge
    actions:
      label:
        remove:
          - automerge

  - name: preserve do-not-merge safety label
    conditions:
      - label=do-not-merge
      - label=automerge
    actions:
      label:
        remove:
          - automerge