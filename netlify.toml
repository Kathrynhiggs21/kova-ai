# Redirect apex -> www and force HTTPS
[[redirects]]
  from = "http://kovaos.com/*"
  to = "https://www.kovaos.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kovaos.com/*"
  to = "https://www.kovaos.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"